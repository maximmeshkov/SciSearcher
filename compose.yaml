services:
  scisearcher:
    build: .
    image: "${SCISEARCHER_IMAGE:-scisearcher:local}"
    restart: unless-stopped
    ports:
      - "${SCISEARCHER_BIND:-127.0.0.1}:${SCISEARCHER_PORT:-8738}:8080"
    environment:
      INDEXER_PASSWORD: ${INDEXER_PASSWORD:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      IEEE_API_KEY: ${IEEE_API_KEY:-}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
      MINERU_URL: ${MINERU_URL:-}
      MINERU_API_KEY: ${MINERU_API_KEY:-}
      MINERU_TIER: ${MINERU_TIER:-}
      MINERU_TIMEOUT_HOURS: ${MINERU_TIMEOUT_HOURS:-48}
      PARSE_WORKERS: ${PARSE_WORKERS:-1}
      MAX_DOWNLOAD_MB: ${MAX_DOWNLOAD_MB:-200}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      RAG_BASE_URL: ${RAG_BASE_URL:-http://host.docker.internal:1234/v1}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-}
      RAG_CHAT_MODEL: ${RAG_CHAT_MODEL:-}
      RAG_API_KEY: ${RAG_API_KEY:-}
    volumes:
      - "${SCISEARCHER_DATA:-library-data}:/data"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import http.client
          connection = http.client.HTTPConnection("127.0.0.1", 8080, timeout=3)
          connection.request("GET", "/healthz")
          raise SystemExit(connection.getresponse().status != 200)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  library-data:
