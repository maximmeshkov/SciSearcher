services:
  scisearcher:
    build: .
    image: "${SCISEARCHER_IMAGE:-scisearcher:local}"
    restart: unless-stopped
    ports:
      - "${SCISEARCHER_BIND:-127.0.0.1}:${SCISEARCHER_PORT:-8738}:8080"
    environment:
      INDEXER_PASSWORD: ${INDEXER_PASSWORD:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      IEEE_API_KEY: ${IEEE_API_KEY:-}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
      # An explicitly empty MINERU_URL turns MinerU off: PDF text then comes from pypdf.
      MINERU_URL: ${MINERU_URL-http://mineru:8000}
      MINERU_TIER: ${MINERU_TIER:-}
      MINERU_TIMEOUT_HOURS: ${MINERU_TIMEOUT_HOURS:-48}
      PARSE_WORKERS: ${PARSE_WORKERS:-1}
      MAX_DOWNLOAD_MB: ${MAX_DOWNLOAD_MB:-200}
    volumes:
      - library-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import http.client
          connection = http.client.HTTPConnection("127.0.0.1", 8080, timeout=3)
          connection.request("GET", "/healthz")
          raise SystemExit(connection.getresponse().status != 200)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # PDF parsing. Reachable only from scisearcher on the compose network, so it has no published port.
  mineru:
    build:
      context: .
      dockerfile: Dockerfile.mineru
    image: "${MINERU_IMAGE:-scisearcher-mineru:local}"
    restart: unless-stopped
    environment:
      MINERU_DEVICE_MODE: ${MINERU_DEVICE:-cpu}
      MINERU_MODEL_ONNX_DEVICE: ${MINERU_DEVICE:-cpu}
      MINERU_SERVER_TIER: ${MINERU_SERVER_TIER:-auto}
      PARSE_WORKERS: ${PARSE_WORKERS:-1}
    volumes:
      - mineru-models:/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8000/v1/health", timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      # The first start downloads about 1.4 GB of models.
      start_period: 30m

volumes:
  library-data:
  mineru-models:
